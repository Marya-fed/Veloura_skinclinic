<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валериана — Клиника эстетической медицины</title>
    <!-- Google Fonts: Playfair Display & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAF7F2;
            --accent-burgundy: #5E2B4D;
            --accent-gold: #D4AF37;
            --text-main: #333333;
            --text-light: #666666;
            --white: #FFFFFF;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .serif {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(250, 247, 242, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 90px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--accent-burgundy);
        }

        .logo svg {
            width: 36px;
            height: 36px;
            fill: var(--accent-gold);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--accent-burgundy);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .phone-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 15px;
            transition: var(--transition);
        }

        .phone-link:hover {
            color: var(--accent-burgundy);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-burgundy);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: #4a223d;
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--accent-burgundy);
            color: var(--accent-burgundy);
        }

        .btn-outline:hover {
            background-color: var(--accent-burgundy);
            color: var(--white);
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            padding-top: 140px;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .hero-slider {
            position: relative;
            width: 100%;
            min-height: 580px;
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
        }

        .hero-slide.active {
            opacity: 1;
            visibility: visible;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hero-content h1 {
            font-size: 52px;
            line-height: 1.15;
            color: var(--text-main);
        }

        .hero-content p {
            font-size: 18px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .btn-glow {
            position: relative;
            animation: glowPulse 2.5s infinite;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 0 0 rgba(94, 43, 77, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(94, 43, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(94, 43, 77, 0); }
        }

        .hero-image-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            height: 480px;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            padding-bottom: 40px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ddd;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .dot.active {
            background-color: var(--accent-burgundy);
            width: 32px;
            border-radius: 6px;
        }

        /* --- FEATURES BAR --- */
        .features-bar {
            background-color: var(--white);
            padding: 40px 0;
            border-top: 1px solid rgba
